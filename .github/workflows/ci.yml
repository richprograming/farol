name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Testes (core + funções do Convex)
        run: npm test
      - name: Build do Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
